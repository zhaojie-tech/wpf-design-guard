name: release

# Tag-triggered release: full test gate → NuGet trusted publishing (all three packages,
# same version train) → GitHub Release with generated notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        dotnet: ['8.0.x', '10.0.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: dotnet test wpf-design-guard.sln -c Release

  pack-and-publish:
    needs: test-gate
    runs-on: ubuntu-latest
    # NuGet publishing account is an external prerequisite confirmed by the maintainer;
    # trusted publishing requires a configured NuGetApiKey-less OIDC trust on nuget.org.
    permissions:
      contents: write
      id-token: write
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack (single version train)
        run: >
          dotnet pack wpf-design-guard.sln -c Release
          -p:PackageOutputPath=${{ github.workspace }}/artifacts/nupkg
      - name: Publish to nuget.org
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          # Trusted publishing via nuget/login@v1 once the NuGet account prerequisite is confirmed.
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - name: GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/nupkg/*.nupkg
