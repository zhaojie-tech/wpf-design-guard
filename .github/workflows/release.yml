name: release

# Tag-triggered release: test gate -> pack the three packages -> NuGet publish
# (when a key is configured) -> GitHub Release with generated notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests (branch coverage gate)
        run: >
          dotnet test tests/WpfDesignGuard.Core.Tests -c Release -f net10.0
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          /p:Threshold=90 /p:ThresholdType=branch /p:ThresholdStat=total
      - name: Analyzer tests
        run: dotnet test tests/WpfDesignGuard.Analyzers.Tests -c Release -f net10.0
      - name: CLI tests
        run: dotnet test tests/WpfDesignGuard.Cli.Tests -c Release -f net10.0

  pack-and-publish:
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: nuget
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack (single version train)
        run: >
          dotnet pack wpf-design-guard.sln -c Release
          -p:PackageOutputPath=${{ github.workspace }}/artifacts/nupkg
      - name: Note when NuGet publishing is not configured
        if: env.NUGET_API_KEY == ''
        run: echo "::notice::NUGET_API_KEY is not configured — skipping nuget.org publish; packages are attached to the GitHub Release."
      - name: Publish to nuget.org
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/nupkg/*.nupkg
